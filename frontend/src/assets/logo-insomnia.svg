<!-- 
  PLACEHOLDER LOGO — Replace with your actual Insomnia logo
  This is a simplified representation of the described logo:
  Cross/sword with bat wings, neon green glowing eyes
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <!-- Neon green glow filter for the eyes -->
    <filter id="eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wing gradient -->
    <linearGradient id="wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="50%" stop-color="#1a2f5a"/>
      <stop offset="100%" stop-color="#0d1b3d"/>
    </linearGradient>
  </defs>
  
  <!-- Left bat wing -->
  <path d="M100 80 L30 50 L45 70 L15 45 L40 75 L5 55 L35 80 L20 85 L100 95Z" 
        fill="url(#wing-grad)" stroke="#000" stroke-width="3"/>
  
  <!-- Right bat wing (mirrored) -->
  <path d="M100 80 L170 50 L155 70 L185 45 L160 75 L195 55 L165 80 L180 85 L100 95Z" 
        fill="url(#wing-grad)" stroke="#000" stroke-width="3"/>
  
  <!-- Sword/cross vertical blade -->
  <rect x="92" y="10" width="16" height="200" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="3"/>
  
  <!-- Cross guard (horizontal) -->
  <rect x="60" y="85" width="80" height="14" rx="2" fill="#3a3a3a" stroke="#000" stroke-width="3"/>
  
  <!-- Helm/visor block -->
  <rect x="80" y="20" width="40" height="30" rx="3" fill="#1a1a2e" stroke="#000" stroke-width="3"/>
  
  <!-- Left eye (neon green) -->
  <rect x="86" y="30" width="8" height="6" rx="1" fill="#3dff9a" filter="url(#eye-glow)" class="logo-eye"/>
  
  <!-- Right eye (neon green) -->
  <rect x="106" y="30" width="8" height="6" rx="1" fill="#3dff9a" filter="url(#eye-glow)" class="logo-eye"/>
  
  <!-- Pommel gem -->
  <circle cx="100" cy="205" r="6" fill="#e8b88a" stroke="#000" stroke-width="2"/>
</svg>
